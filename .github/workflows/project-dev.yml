---

name: build project-dev

on:
  push:
    branches: 
      - main
    # tags:
    #   - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: pa$$word
          MYSQL_DATABASE: test
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=pa$$word" --health-interval=5s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        php: ['8.4']
    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
            path: ~/.composer/cache/files
            key: dependencies-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick
          ini-values: variables_order=EGPCS
          coverage: none

      - name: Install dependencies
        run: |
          cd src/
          rm -rf vendor composer.lock
          composer install --prefer-install=auto --no-interaction --no-suggest

      - name: Migrations
        run: |
          cd src/vendor/akeb/framework/src/
          SERVER_ROOT=${PWD}../../../../ php migrate.php
        env:
          TZ: 'Europe/Moscow'
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_USERNAME: 'root'
          MYSQL_PASSWORD: 'pa$$word'
          MYSQL_DB_NAME: 'test'
          PASSWORD_SALT: 'salt_for_passwords'

      - name: Run Tests
        run: |
          cd src/
          vendor/bin/phpunit --no-coverage --colors=never -c phpunit.xml
        env:
          TZ: 'Europe/Moscow'
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_USERNAME: 'root'
          MYSQL_PASSWORD: 'pa$$word'
          MYSQL_DB_NAME: 'test'
          PASSWORD_SALT: 'salt_for_passwords'

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            qemu: false
          - platform: linux/arm64
            suffix: arm64
            qemu: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: akeb/monitoring:dev-${{ matrix.suffix }}
          build-args: |
            SERVER_VERSION=dev
          cache-from: type=gha,scope=dev-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.suffix }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch dev manifest
        run: |
          docker buildx imagetools create -t akeb/monitoring:dev \
            akeb/monitoring:dev-amd64 \
            akeb/monitoring:dev-arm64
